name: Docs checks

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: docs-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Docs checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: make install

            - name: Check and build
              run: make verify
